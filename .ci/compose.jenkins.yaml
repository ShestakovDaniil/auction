name: auction-lab5

services:
  workspace-init:
    image: docker:29-cli
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/workspaces"]
    volumes:
      - workspaces:/workspaces

  registry:
    image: registry:3
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /tls/server.crt
      REGISTRY_HTTP_TLS_KEY: /tls/server.key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: auction-ci
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./registry/server.crt:/tls/server.crt:ro
      - ./registry/server.key:/tls/server.key:ro
      - ./registry/htpasswd:/auth/htpasswd:ro
      - registry_data:/var/lib/registry

  dind:
    image: docker:29-dind
    privileged: true
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - dind_data:/var/lib/docker
      - ./dind-daemon.json:/etc/docker/daemon.json:ro
      - client_certs:/certs/client
      - workspaces:/var/jenkins_home/workspace
      - ./registry/docker-certs:/etc/docker/certs.d:ro
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      retries: 20

  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    depends_on:
      dind:
        condition: service_healthy
      registry:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xmx1536m"
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - jenkins_home:/var/jenkins_home
      - workspaces:/var/jenkins_home/workspace
      - client_certs:/certs/client:ro
      - ./registry/docker-certs:/etc/docker/certs.d:ro

volumes:
  jenkins_home:
  workspaces:
  client_certs:
  dind_data:
  registry_data:
